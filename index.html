<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Control de Gastos Compartidos</title>
		<meta
			name="description"
			content="Panel estático para visualizar gastos y tareas compartidas entre roomies."
		/>
		<script src="https://cdn.tailwindcss.com"></script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body class="min-h-screen antialiased">
		<div class="page-bg" aria-hidden="true"></div>

		<main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8 lg:py-10">
			<header class="glass-panel p-6 sm:p-8">
				<p class="eyebrow">Roomies Dashboard</p>
				<h1 class="mt-2 text-2xl font-extrabold tracking-tight text-slate-800 sm:text-4xl">
					<a
						href="index.html"
						class="inline-flex items-center rounded-lg px-1 py-0.5 transition hover:bg-sky-50 hover:text-sky-700"
					>
						Control de Gastos Compartidos
					</a>
				</h1>
				<p class="mt-2 text-sm text-slate-600 sm:text-base">
					Selecciona un roomie para ver su detalle de gastos y tareas.
				</p>
				<button
					id="openRulesGallery"
					type="button"
					class="mt-4 inline-flex items-center gap-2 rounded-xl bg-sky-600 px-4 py-2.5 text-sm font-extrabold text-white shadow-lg shadow-sky-600/30 transition hover:bg-sky-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-400"
				>
					<span aria-hidden="true">📘</span>
					Ver reglas de convivencia
				</button>
			</header>

			<section class="mt-6" aria-labelledby="roomiesTitle">
				<h2 id="roomiesTitle" class="section-title">Roomies</h2>
				<div id="roommatesCards" class="mt-3 flex flex-col gap-2"></div>
			</section>

			<section class="mt-6" aria-labelledby="turnosTitle">
				<h2 id="turnosTitle" class="section-title">Turnos de gastos compartidos</h2>
				<p class="mt-2 text-sm text-slate-600">
					La fecha más antigua define a quién le toca el siguiente turno de compra o pago.
				</p>
				<div id="sharedTurns" class="mt-3 flex flex-col gap-2"></div>
			</section>
		</main>

		<div
			id="rulesModal"
			class="rules-modal hidden"
			role="dialog"
			aria-modal="true"
			aria-labelledby="rulesModalTitle"
		>
			<div class="rules-modal__backdrop" data-close-modal="true"></div>
			<div class="rules-modal__panel" role="document">
				<div class="rules-modal__header">
					<h2 id="rulesModalTitle" class="text-base font-extrabold text-slate-800 sm:text-lg">
						Reglas de convivencia
					</h2>
					<button
						id="closeRulesGallery"
						type="button"
						class="rules-modal__close"
						aria-label="Cerrar galería"
					>
						×
					</button>
				</div>

				<div id="rulesTrack" class="rules-modal__track">
					<img id="rulesImage" src="" alt="Regla de convivencia" class="rules-modal__image" />
				</div>

				<div class="rules-modal__footer">
					<button id="prevRule" type="button" class="rules-modal__nav">Anterior</button>
					<p id="rulesCounter" class="rules-modal__counter" aria-live="polite"></p>
					<button id="nextRule" type="button" class="rules-modal__nav">Siguiente</button>
				</div>
			</div>
		</div>

		<script src="script.js"></script>
	</body>
</html>
