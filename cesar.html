<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Cesar | Control de Gastos Compartidos</title>
		<meta
			name="description"
			content="Detalle de gastos y tareas de Cesar en el dashboard de roomies."
		/>
		<script src="https://cdn.tailwindcss.com"></script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body class="min-h-screen antialiased">
		<div class="page-bg" aria-hidden="true"></div>

		<main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8 lg:py-10">
			<header class="glass-panel p-6 sm:p-8">
				<div class="flex flex-wrap items-center justify-between gap-3">
					<p class="eyebrow">Detalle de Roomie</p>
					<a
						href="index.html"
						class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-bold text-slate-700 transition hover:border-sky-300 hover:text-sky-700"
					>
						Volver al inicio
					</a>
				</div>
				<h1 class="mt-3 text-3xl font-extrabold tracking-tight text-slate-800 sm:text-4xl">Cesar</h1>
				<p class="mt-2 text-sm text-slate-600 sm:text-base">
					Resumen individual de compras, servicios y tareas.
				</p>
			</header>

			<section id="roomieDetail" data-roomie="cesar" class="mt-6" aria-label="Detalle de Cesar"></section>
		</main>

		<script src="script.js"></script>
	</body>
</html>
