<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Control de Gastos Compartidos</title>
		<meta
			name="description"
			content="Panel estático para visualizar gastos y tareas compartidas entre roomies."
		/>
		<script src="https://cdn.tailwindcss.com"></script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body class="min-h-screen antialiased">
		<div class="page-bg" aria-hidden="true"></div>

		<main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8 lg:py-10">
			<header class="glass-panel p-6 sm:p-8">
				<p class="eyebrow">Roomies Dashboard</p>
				<h1 class="mt-2 text-2xl font-extrabold tracking-tight text-slate-800 sm:text-4xl">
					<a
						href="ivan.html"
						class="inline-flex items-center rounded-lg px-1 py-0.5 transition hover:bg-sky-50 hover:text-sky-700"
					>
						Control de Gastos Compartidos
					</a>
				</h1>
				<p class="mt-2 text-sm text-slate-600 sm:text-base">
					Departamento de Julio, Osmar e Ivan
				</p>
				<p id="currentDate" class="mt-4 inline-flex items-center rounded-full bg-white/70 px-3 py-1 text-xs font-semibold text-slate-700 shadow-sm sm:text-sm"></p>
			</header>

			<section class="mt-6" aria-labelledby="roomiesTitle">
				<h2 id="roomiesTitle" class="section-title">Roomies</h2>
				<div id="roommatesCards" class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3"></div>
			</section>

			<section class="mt-6" aria-labelledby="filtersTitle">
				<h2 id="filtersTitle" class="section-title">Filtros y búsqueda</h2>

				<div class="glass-panel mt-3 p-4 sm:p-5">
					<div class="grid gap-4 lg:grid-cols-3">
						<div>
							<p class="filter-label">Categoría</p>
							<div id="categoryFilters" class="mt-2 flex flex-wrap gap-2"></div>
						</div>

						<div>
							<p class="filter-label">Estado</p>
							<div id="statusFilters" class="mt-2 flex flex-wrap gap-2"></div>
						</div>

						<div>
							<label for="searchInput" class="filter-label">Buscador</label>
							<input
								id="searchInput"
								type="text"
								placeholder="Buscar concepto..."
								class="search-input mt-2"
							/>
						</div>
					</div>

					<div class="mt-5 grid gap-4 sm:grid-cols-2">
						<div>
							<label for="sortBy" class="filter-label">Ordenar por</label>
							<select id="sortBy" class="select-input mt-2">
								<option value="name">Nombre del concepto</option>
								<option value="status">Estado</option>
								<option value="date">Fecha</option>
							</select>
						</div>

						<div>
							<label for="sortDirection" class="filter-label">Dirección</label>
							<select id="sortDirection" class="select-input mt-2">
								<option value="asc">Ascendente</option>
								<option value="desc">Descendente</option>
							</select>
						</div>
					</div>
				</div>
			</section>

			<section class="mt-6" aria-labelledby="tableTitle">
				<h2 id="tableTitle" class="section-title">Tabla principal</h2>

				<div class="glass-panel mt-3 overflow-hidden p-2 sm:p-3">
					<div class="overflow-x-auto">
						<table class="w-full min-w-[680px] border-separate border-spacing-0 text-sm">
							<thead id="tableHead"></thead>
							<tbody id="tableBody"></tbody>
						</table>
					</div>
				</div>
			</section>
		</main>

		<script src="script.js"></script>
	</body>
</html>
